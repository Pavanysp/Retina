<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diabetic Retinopathy Detection With hospital suggestion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        #map, #results {
            display: none;
            margin-top: 20px;
        }
        .clinic-card {
            padding: 10px;
            background: #f4f4f4;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .highlight {
            color: green;
            font-weight: bold;
        }
        .preview {
            max-width: 300px;
            margin-top: 10px;
        }
        .back-home {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>🧠 Diabetic Retinopathy Detection</h1>

    <!-- Upload Form -->
    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required />
        <button type="submit">📤 Upload & Predict</button>
    </form>

    <!-- Prediction Result -->
    {% if result %}
    <div class="result">
        <h2>🩺 Prediction: <span class="highlight">{{ result }}</span> ({{ confidence }}%)</h2>
        <img src="{{ image_path }}" alt="Uploaded Image" class="preview">
    </div>
    {% endif %}

    <!-- Clinic Locator -->
    {% if disease %}
    <h2>🏥 Nearby Eye Clinics:</h2>
    <button onclick="findClinics()">🔍 Find Eye Clinics Near Me</button>
    <div id="map" style="height: 400px;"></div>
    <div id="results">Searching for your location...</div>
    {% endif %}

    <!-- Home Button -->
    <div class="back-home">
        <a href="/"><button>🔙 Go to Home</button></a>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- Map & Clinic Logic -->
    <script>
        let map;

        function findClinics() {
            document.getElementById('map').style.display = 'block';
            document.getElementById('results').style.display = 'block';
            document.getElementById('results').innerHTML = "Searching for your location...";

            navigator.geolocation.getCurrentPosition(function(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                if (map) map.remove();
                map = L.map('map').setView([lat, lon], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);

                L.marker([lat, lon]).addTo(map).bindPopup("📍 You are here").openPopup();

                const query = `[out:json];
                (
                    node(around:5000,${lat},${lon})[amenity=hospital];
                    node(around:5000,${lat},${lon})[healthcare=doctor];
                    node(around:5000,${lat},${lon})[amenity=clinic];
                );
                out body;`;

                const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        const results = document.getElementById('results');
                        results.innerHTML = "";

                        const keywords = ["eye", "vision", "retina", "ophthalmology", "optical", "dr", "clinic", "hospital"];

                        function getDistanceKm(lat1, lon1, lat2, lon2) {
                            const R = 6371;
                            const dLat = (lat2 - lat1) * Math.PI / 180;
                            const dLon = (lon2 - lon1) * Math.PI / 180;
                            const a = Math.sin(dLat / 2) ** 2 +
                                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                                Math.sin(dLon / 2) ** 2;
                            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                            return R * c;
                        }

                        const filtered = data.elements
                            .map(el => {
                                const name = (el.tags.name || "").toLowerCase();
                                const match = keywords.some(k => name.includes(k));
                                const dist = getDistanceKm(lat, lon, el.lat, el.lon);
                                return match ? {...el, distance: dist } : null;
                            })
                            .filter(el => el && el.distance <= 5)
                            .sort((a, b) => a.distance - b.distance);

                        if (filtered.length === 0) {
                            results.innerHTML = "<p>😞 No relevant eye clinics found nearby (within 5 km).</p>";
                            return;
                        }

                        filtered.forEach(place => {
                            const name = place.tags.name || "Clinic/Hospital";
                            const latlon = `${place.lat},${place.lon}`;
                            const directionLink = `https://www.google.com/maps/dir/?api=1&destination=${latlon}`;
                            const card = `
                                <div class="clinic-card">
                                    <strong>${name}</strong><br>
                                    📏 ${place.distance.toFixed(2)} km away<br>
                                    <a href="${directionLink}" target="_blank">➡️ Get Directions</a>
                                </div><hr>`;
                            results.innerHTML += card;

                            L.marker([place.lat, place.lon])
                                .addTo(map)
                                .bindPopup(`${name}<br><a href="${directionLink}" target="_blank">📍 Directions</a>`);
                        });
                    })
                    .catch(err => {
                        document.getElementById('results').innerHTML = "❌ Failed to fetch clinic data.";
                        console.error(err);
                    });
            }, function(err) {
                document.getElementById('results').innerHTML = "❌ Location access denied.";
                console.error(err.message);
            });
        }
    </script>
</body>
</html>
