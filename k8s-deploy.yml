---
- name: Deploy to Kubernetes with Minikube
  hosts: local
  become: true

  vars:
    workspace_dir: "{{ lookup('env', 'WORKSPACE') | default('/var/lib/jenkins/workspace/Retina') }}"
    kube_dir: "{{ workspace_dir }}/.kube"
    minikube_dir: "{{ workspace_dir }}/.minikube"

  tasks:
    - name: Delete Minikube cluster if exists
      shell: minikube delete || true
      environment:
        HOME: "{{ workspace_dir }}"
        USER: jenkins

    - name: Create ~/.kube and ~/.minikube directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ minikube_dir }}"
        - "{{ kube_dir }}"

    - name: Start Minikube using Docker driver
      shell: >
        minikube start --driver=docker
        --wait=none --force --install-addons=true --delete-on-failure
      environment:
        HOME: "{{ workspace_dir }}"
        USER: jenkins

    - name: Apply Kubernetes manifests from local k8s/ folder
      shell: kubectl apply -f ./k8s/ --validate=false
      args:
        chdir: "{{ workspace_dir }}"
      environment:
        HOME: "{{ workspace_dir }}"
        KUBECONFIG: "{{ kube_dir }}/config"
