version: '3.8'

services:
  # Web service
  web-service:
    build:
      context: ./web-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PREDICTION_SERVICE_URL=http://prediction-service:5001
    volumes:
      - ./web-service/static/uploads:/app/static/uploads
    depends_on:
      - prediction-service
    # Uncomment the following if using logstash for logging:
    # logging:
    #   driver: "gelf"
    #   options:
    #     gelf-address: "udp://logstash:12201"
    networks:
      - retinopathy-network

  # Prediction service
  prediction-service:
    build:
      context: ./prediction-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    # Uncomment the following if using logstash for logging:
    # logging:
    #   driver: "gelf"
    #   options:
    #     gelf-address: "udp://logstash:12201"
    networks:
      - retinopathy-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - retinopathy-network

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.0
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "12201:12201/udp"
    depends_on:
      - elasticsearch
    networks:
      - retinopathy-network

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - retinopathy-network

networks:
  retinopathy-network:
    driver: bridge

volumes:
  elasticsearch-data:
